<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario World - Authentic Clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0; background-color: #111; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Press Start 2P', 'Courier New', Courier, monospace;
            overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #game-container {
            position: relative; width: 100%; aspect-ratio: 4/3; max-height: 85vh;
            background-color: #5c94fc; border: 4px solid #fff; border-radius: 8px;
            overflow: hidden; transition: background-color 0.5s ease; box-shadow: 0 0 20px rgba(0,0,0,0.8);
            outline: none; /* remove focus outline */
        }

        canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

        #ui-layer {
            position: absolute; top: 15px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; color: #fff;
            font-size: 16px; line-height: 1.5; text-shadow: 2px 2px 0 #000; z-index: 10;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); color: white; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            font-size: 24px; z-index: 20; text-shadow: 3px 3px 0 #000; text-align: center; line-height: 2;
        }
        
        .restart-btn {
            margin-top: 30px; padding: 15px 25px; font-size: 16px; font-family: 'Press Start 2P', monospace;
            background: #e52521; color: white; border: 4px solid white; cursor: pointer; text-transform: uppercase;
        }
        .restart-btn:hover { background: #ff4541; }
        
        #instructions { color: #fff; margin-bottom: 10px; font-size: 12px; text-align: center; opacity: 0.8; cursor: pointer; }
        .controls-sub { color: #f8d820; font-size: 10px; margin-top: 5px; line-height: 1.5; }
    </style>
</head>
<body>

    <div id="instructions">
        SUPER MARIO WORLD CLONE (Click to focus)
        <div class="controls-sub">Move: Arrows/WASD | Jump: Up/Z/K | Spin Jump: C/Num2<br>Sprint/Grab: Num0/Shift/X/J | Fire/Cape: Num1/X/J</div>
    </div>

    <div id="game-container" tabindex="0">
        <div id="ui-layer">
            <div>MARIO<br><span id="score">000000</span></div>
            <div><br>&#x26C3;x<span id="coins">00</span></div> 
            <div>WORLD<br><span id="world-text">YOSHI'S IS.<br>1-1</span></div>
            <div>LIVES<br><span id="lives">3</span></div>
        </div>

        <div id="transition-screen" class="overlay" style="background-color: #000;">
            <div style="margin-bottom: 30px;"><span id="trans-world-name">YOSHI'S ISLAND</span> <span id="trans-world">1-1</span></div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div style="width: 32px; height: 32px; background: #e52521; border-radius: 5px; border: 2px solid #fff;"></div>
                <div>x <span id="trans-lives">3</span></div>
            </div>
        </div>
        
        <div id="game-over" class="overlay">
            GAME OVER
            <button class="restart-btn" onclick="fullReset()">Try Again</button>
        </div>
        
        <div id="level-clear" class="overlay"></div>

        <canvas id="gameCanvas" width="640" height="480"></canvas>
    </div>

    <script>
        window.onload = () => { window.focus(); document.getElementById('game-container').focus(); };
        document.addEventListener('click', () => { window.focus(); document.getElementById('game-container').focus(); });

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0, coinsCollected = 0, lives = 3, cameraX = 0;
        let gameState = 'transition'; 
        let keys = { right: false, left: false, up: false, down: false, sprint: false, shoot: false, spin: false };
        let animationFrameId;
        
        let currentLevelIndex = 0, currentLevelData = null;
        let imageCache = {}; // HARDWARE OPTIMIZATION CACHE

        const GRAVITY = 0.6; const friction = 0.8;
        const WALK_ACCEL = 0.5; const RUN_ACCEL = 0.8;
        const MAX_WALK = 5; const MAX_RUN = 8; const MAX_FALL = 10;
        const JUMP_HOLD_GRAVITY = 0.25; const CAPE_GLIDE_GRAVITY = 0.08;
        let maxSpeed = MAX_WALK; 
        const JUMP_FORCE = -13; const SPIN_JUMP_FORCE = -11; const SKID_FRICTION = 0.15;

        let player;
        let platforms = [], enemies = [], particles = [], items = [], fireballs = [], enemyFireballs = [];
        let warpTarget = null;
        let lastFrameTime = 0; const FPS_INTERVAL = 1000 / 60; 

        const SMW_WORLDS = ["YOSHI'S ISLAND", "DONUT PLAINS", "VANILLA DOME", "TWIN BRIDGES", "FOREST OF ILLUSION", "CHOCOLATE ISLAND", "VALLEY OF BOWSER", "STAR WORLD", "SPECIAL ZONE"];

        // ================= HARDWARE CACHING ENGINE =================
        function createCacheCanvas(w, h, renderFunc) {
            let c = document.createElement('canvas'); c.width = w; c.height = h;
            renderFunc(c.getContext('2d'), w, h);
            return c;
        }

        function generateCaches(levelData) {
            // Ground & Brick Tiles
            imageCache.ground = createCacheCanvas(40, 40, (cx) => {
                let grad = cx.createLinearGradient(0, 0, 40, 40); grad.addColorStop(0, levelData.groundColor); grad.addColorStop(1, "#333");
                cx.fillStyle = grad; cx.fillRect(0,0,40,40);
                cx.fillStyle = "rgba(255,255,255,0.4)"; cx.fillRect(0,0,40,4); cx.fillRect(0,0,4,40); 
                cx.fillStyle = "rgba(0,0,0,0.5)"; cx.fillRect(0,36,40,4); cx.fillRect(36,0,4,40);
            });
            imageCache.brick = createCacheCanvas(40, 40, (cx) => {
                let bGrad = cx.createLinearGradient(0, 0, 0, 40); bGrad.addColorStop(0, levelData.brickColor); bGrad.addColorStop(1, "#222");
                cx.fillStyle = bGrad; cx.fillRect(0,0,40,40);
                cx.fillStyle = "rgba(255,255,255,0.5)"; cx.fillRect(0,0,40,2); cx.fillRect(20,20,20,2); 
                cx.fillStyle = "rgba(0,0,0,0.8)"; cx.fillRect(0,18,40,4); cx.fillRect(0,38,40,2); cx.fillRect(18,0,4,18); cx.fillRect(38,18,2,22);
            });
            // Q-Blocks
            imageCache.qblock = createCacheCanvas(40, 40, (cx) => {
                cx.fillStyle = "#f8d820"; cx.fillRect(0,0,40,40); cx.strokeStyle = "#000"; cx.lineWidth=2; cx.strokeRect(0,0,40,40);
                cx.fillStyle = "#c84c0c"; cx.fillRect(4,4,4,4); cx.fillRect(32,4,4,4); cx.fillRect(4,32,4,4); cx.fillRect(32,32,4,4);
                cx.fillRect(12,8,16,4); cx.fillRect(24,12,4,8); cx.fillRect(16,16,12,4); cx.fillRect(16,20,4,4); cx.fillRect(16,28,4,4);
            });
            imageCache.qblockFlash = createCacheCanvas(40, 40, (cx) => {
                cx.fillStyle = "#f88800"; cx.fillRect(0,0,40,40); cx.strokeStyle = "#000"; cx.lineWidth=2; cx.strokeRect(0,0,40,40);
                cx.fillStyle = "#c84c0c"; cx.fillRect(4,4,4,4); cx.fillRect(32,4,4,4); cx.fillRect(4,32,4,4); cx.fillRect(32,32,4,4);
                cx.fillRect(12,8,16,4); cx.fillRect(24,12,4,8); cx.fillRect(16,16,12,4); cx.fillRect(16,20,4,4); cx.fillRect(16,28,4,4);
            });
            imageCache.qblockHit = createCacheCanvas(40, 40, (cx) => {
                cx.fillStyle = levelData.groundColor; cx.fillRect(0,0,40,40); cx.strokeStyle = "#000"; cx.lineWidth=2; cx.strokeRect(0,0,40,40);
                cx.fillStyle = "#000"; cx.fillRect(4,4,4,4); cx.fillRect(32,32,4,4);
            });
            // Parallax Background layer (Seamless 1024px width)
            imageCache.parallax = createCacheCanvas(1024, 480, (cx) => {
                // Background gradient
                let bgGrad = cx.createLinearGradient(0, 0, 0, 480);
                bgGrad.addColorStop(0, levelData.bg); bgGrad.addColorStop(1, levelData.isUnderground ? "#000" : "#fff");
                cx.fillStyle = bgGrad; cx.fillRect(0, 0, 1024, 480);
                if(!levelData.isUnderground && !levelData.isUnderwater) {
                    for(let i=0; i<10; i++) {
                        let sx = i * 100 + Math.random() * 50; let sy = 50 + Math.random() * 80;
                        let cGrad = cx.createRadialGradient(sx+20, sy, 5, sx+20, sy, 40);
                        cGrad.addColorStop(0, "rgba(255,255,255,0.9)"); cGrad.addColorStop(1, "rgba(200,200,255,0.0)");
                        cx.fillStyle = cGrad; cx.beginPath(); cx.arc(sx, sy, 25, 0, Math.PI*2); cx.arc(sx+40, sy, 30, 0, Math.PI*2); cx.arc(sx+80, sy, 25, 0, Math.PI*2); cx.fill();
                    }
                    for(let i=0; i<8; i++) {
                        let hx = i * 140; let hy = 420;
                        let hGrad = cx.createLinearGradient(hx, hy-120, hx, hy);
                        hGrad.addColorStop(0, "#4ade80"); hGrad.addColorStop(1, "#166534");
                        cx.fillStyle = hGrad; cx.beginPath(); cx.moveTo(hx, hy); cx.lineTo(hx+80, hy-150); cx.lineTo(hx+160, hy); cx.fill();
                    }
                } else if(levelData.isUnderwater) {
                    cx.fillStyle = "rgba(32, 56, 236, 0.4)"; cx.fillRect(0, 0, 1024, 480);
                }
            });
        }

        // ================= LEVEL DATA GENERATOR =================
        function loadLevelData(index) {
            let w = Math.floor(index / 4); let l = (index % 4) + 1;
            let worldName = SMW_WORLDS[Math.min(w, SMW_WORLDS.length - 1)];

            let bg = "#5c94fc"; let groundColor = "#c84c0c"; let brickColor = "#e06c28";
            let isUnderground = false; let isUnderwater = false;

            if (w === 1) { bg = "#87ceeb"; groundColor = "#228b22"; brickColor = "#d2691e"; } 
            if (w === 2) { bg = "#000000"; groundColor = "#8b4513"; brickColor = "#a0522d"; isUnderground=true; } 
            if (w === 3) { bg = "#ff9966"; groundColor = "#cd853f"; brickColor = "#8b4513"; } 
            if (w === 4) { bg = "#003300"; groundColor = "#228b22"; brickColor = "#556b2f"; } 
            if (w === 5) { bg = "#d2b48c"; groundColor = "#8b4513"; brickColor = "#a0522d"; } 
            if (w === 6) { bg = "#330000"; groundColor = "#505050"; brickColor = "#303030"; } 
            if (w >= 7) { bg = "#000033"; groundColor = "#ffd700"; brickColor = "#ff8c00"; } 

            if (l === 2) {
                if (w % 2 === 0) { isUnderwater = true; bg = "#2038ec"; groundColor = "#a8e46a"; brickColor = "#e52521"; isUnderground=false; }
                else { isUnderground = true; bg = "#000000"; groundColor = "#0058f8"; brickColor = "#0058f8"; }
            }
            if (l === 4) {
                bg = "#000000"; groundColor = "#a8a8a8"; brickColor = "#505050"; isUnderground=true;
                if (w === 6) { groundColor = "#e52521"; brickColor = "#a84400"; }
            }

            let targetLength = 8000 + (w * 500); 
            let platforms = []; let enemies = []; let items = [];

            platforms.push({ x: 0, y: 400, w: 600, h: 80, type: 'ground', bounceY: 0 });

            // Ensure 1-1 bonus room logic is preserved
            if (index === 0) {
                platforms.push({ x: 300, y: 250, w: 40, h: 40, type: 'q-block', hit: false, content: 'yoshi_egg', bounceY: 0 });
                platforms.push({ x: 640, y: 300, w: 60, h: 100, type: 'pipe', entrance: true, warpX: 5040, warpY: 900, exitUp: false, bounceY: 0 });
                // Hidden 1UP
                platforms.push({ x: 200, y: 250, w: 40, h: 40, type: 'hidden-block', hit: false, content: '1up', bounceY: 0 });
                
                platforms.push({ x: 5000, y: 1400, w: 800, h: 80, type: 'ground', bounceY: 0 }); 
                platforms.push({ x: 4920, y: 800, w: 80, h: 680, type: 'ground', bounceY: 0 }); 
                platforms.push({ x: 5800, y: 800, w: 80, h: 680, type: 'ground', bounceY: 0 }); 
                platforms.push({ x: 5080, y: 1290, w: 500, h: 20, type: 'stair', bounceY: 0 }); 
                platforms.push({ x: 5700, y: 1300, w: 60, h: 100, type: 'pipe', entrance: true, warpX: 1264, warpY: 340, exitUp: true, exitY: 280, bounceY: 0 });
                
                for (let col = 0; col < 14; col++) {
                    items.push({ x: 5080 + col * 36, y: 1360, w: 30, h: 30, type: 'static_coin', active: true }); 
                    items.push({ x: 5080 + col * 36, y: 1250, w: 30, h: 30, type: 'static_coin', active: true }); 
                }
            }

            let currentX = 600;
            while (currentX < targetLength) {
                let gap = (l !== 2 || !isUnderwater) ? (Math.random() > 0.4 ? (60 + w * 10) : 0) : 0;
                if (l === 4 && gap > 0) platforms.push({ x: currentX, y: 440, w: gap, h: 40, type: 'lava', bounceY: 0 });
                currentX += gap;

                let platWidth = 300 + Math.random() * 400;
                if (l === 3) {
                    platWidth = 80 + Math.random() * 100; 
                    let yPos = 150 + Math.random() * 200;
                    platforms.push({ x: currentX, y: yPos, w: platWidth, h: 20, type: 'stair', bounceY: 0 });
                    if (Math.random() > 0.6) platforms.push({ x: currentX + platWidth/2 - 20, y: yPos - 80, w: 40, h: 40, type: 'q-block', hit: false, content: Math.random() > 0.85 ? 'feather' : 'coin', bounceY: 0 });
                    if (Math.random() > 0.5) enemies.push({ x: currentX + platWidth/2, y: yPos - 40, w: 30, h: 40, vx: -1, vy: 0, type: 'koopa', state: 'walk', dead: false, squishTimer: 0 });
                } else if (isUnderwater) {
                    platforms.push({ x: currentX, y: 400, w: platWidth, h: 80, type: 'ground', bounceY: 0 });
                    platforms.push({ x: currentX + platWidth/2 - 40, y: 400 - 150, w: 80, h: 150, type: 'stair', bounceY: 0 });
                    enemies.push({ x: currentX + 100, y: 200, w: 30, h: 30, baseY: 200, vx: -1.5, vy: 0, type: 'cheepcheep', dead: false, squishTimer: 0 });
                } else {
                    platforms.push({ x: currentX, y: 400, w: platWidth, h: 80, type: 'ground', bounceY: 0 });
                    if (Math.random() < 0.3 && l !== 4) {
                        platforms.push({ x: currentX + platWidth/2 - 25, y: 320, w: 50, h: 80, type: 'pipe', bounceY: 0 });
                        if (Math.random() > 0.4) enemies.push({ x: currentX + platWidth/2 - 20, y: 270, w: 40, h: 50, baseY: 320, vy: -1, type: 'piranha', state: 'up', timer: 0, dead: false });
                    } else if (Math.random() < 0.6 && l !== 4) {
                        platforms.push({ x: currentX + 60, y: 250, w: 40, h: 40, type: 'block', dead: false, bounceY: 0 });
                        platforms.push({ x: currentX + 100, y: 250, w: 40, h: 40, type: 'q-block', hit: false, content: Math.random() > 0.8 ? 'yoshi_egg' : 'coin', bounceY: 0 });
                        platforms.push({ x: currentX + 140, y: 250, w: 40, h: 40, type: 'block', dead: false, bounceY: 0 });
                    }
                    if (Math.random() > 0.5) {
                        let eType = Math.random() > 0.5 ? 'goomba' : 'koopa';
                        enemies.push({ x: currentX + platWidth/2, y: 360, w: 30, h: eType === 'koopa' ? 40 : 30, vx: -1, vy: 0, type: eType, state: 'walk', dead: false, squishTimer: 0 });
                    }
                }
                currentX += platWidth;
            }

            let finalEndX;
            if (l === 4) {
                platforms.push({ x: currentX, y: 400, w: 1000, h: 80, type: 'lava', bounceY: 0 });
                platforms.push({ x: currentX, y: 300, w: 400, h: 20, type: 'bridge', bounceY: 0 });
                platforms.push({ x: currentX + 400, y: 300, w: 600, h: 150, type: 'ground', bounceY: 0 });
                platforms.push({ x: currentX + 400, y: 260, w: 40, h: 40, type: 'axe', dead: false, bounceY: 0 });
                enemies.push({ x: currentX + 250, y: 220, w: 64, h: 64, vx: -1, vy: 0, type: 'bowser', hp: 5 + w, state: 'walk', timer: 0, dead: false });
                finalEndX = currentX + 600;
            } else {
                platforms.push({ x: currentX, y: 400, w: 800, h: 80, type: 'ground', bounceY: 0 });
                platforms.push({ x: currentX + 100, y: 360, w: 40, h: 40, type: 'stair', bounceY: 0 }); 
                platforms.push({ x: currentX + 140, y: 320, w: 40, h: 80, type: 'stair', bounceY: 0 }); 
                platforms.push({ x: currentX + 180, y: 280, w: 40, h: 120, type: 'stair', bounceY: 0 }); 
                platforms.push({ x: currentX + 220, y: 240, w: 40, h: 160, type: 'stair', bounceY: 0 }); 
                platforms.push({ x: currentX + 420, y: 360, w: 40, h: 40, type: 'stair', bounceY: 0 }); 
                platforms.push({ x: currentX + 435, y: 80, w: 10, h: 280, type: 'pole', bounceY: 0 });
                finalEndX = currentX + 620;
            }

            if (isUnderground || l === 4) platforms.push({ x: 0, y: -50, w: finalEndX + 1000, h: 100, type: 'ground', bounceY: 0 }); 

            return { worldText: (w+1)+"-"+l, worldName: worldName, bg: bg, groundColor: groundColor, brickColor: brickColor, endX: finalEndX, platforms: platforms, enemies: enemies, staticItems: items, isUnderground: isUnderground, isUnderwater: isUnderwater };
        }

        // ================= GAME LOGIC & INITIALIZATION =================
        function startTransition(index) {
            currentLevelIndex = index;
            document.getElementById('game-over').style.display = 'none'; document.getElementById('level-clear').style.display = 'none';
            let tempLevelData = loadLevelData(currentLevelIndex);
            document.getElementById('trans-world').innerText = tempLevelData.worldText; document.getElementById('trans-world-name').innerText = tempLevelData.worldName;
            document.getElementById('trans-lives').innerText = lives;
            document.getElementById('transition-screen').style.display = 'flex';
            gameState = 'transition';
            setTimeout(() => { document.getElementById('transition-screen').style.display = 'none'; initLevel(tempLevelData); }, 2500);
        }

        function initLevel(lvlData) {
            cameraX = 0; gameState = 'playing'; warpTarget = null;
            currentLevelData = lvlData;
            generateCaches(currentLevelData);
            document.getElementById('world-text').innerHTML = currentLevelData.worldName + "<br>" + currentLevelData.worldText;

            let startPower = (typeof player !== 'undefined' && !player.dead && lives > 0) ? player.powerLevel : 0;
            let startYoshi = (typeof player !== 'undefined' && !player.dead && lives > 0) ? player.onYoshi : false;

            player = {
                x: 100, y: 200, w: 32, h: startPower > 0 ? 64 : 32, vx: 0, vy: 0, jumps: 0, maxJumps: 1,
                isGrounded: false, dead: false, visible: true, powerLevel: startPower, invincibleTimer: 0, starTimer: 0, 
                isCrouching: false, faceDir: 1, isSpinning: false, onYoshi: startYoshi, carrying: null
            };
            if (player.onYoshi) player.h += 20;

            platforms = currentLevelData.platforms; enemies = currentLevelData.enemies; items = currentLevelData.staticItems;
            particles = []; fireballs = []; enemyFireballs = [];
            updateUI();
        }

        function nextLevel() { startTransition(currentLevelIndex + 1); }
        function fullReset() { lives = 3; score = 0; coinsCollected = 0; player = undefined; startTransition(0); }
        function resetGame() { player = undefined; startTransition(currentLevelIndex); }

        // --- BULLETPROOF INPUT HANDLING ---
        const activeKeys = {};
        let jumpHandled = false; let shootHandled = false; let spinHandled = false;

        function updateVirtualKeys() {
            keys.left = activeKeys["ArrowLeft"] || activeKeys["KeyA"] || activeKeys["a"];
            keys.right = activeKeys["ArrowRight"] || activeKeys["KeyD"] || activeKeys["d"];
            keys.down = activeKeys["ArrowDown"] || activeKeys["KeyS"] || activeKeys["s"];
            keys.sprint = activeKeys["ShiftLeft"] || activeKeys["KeyX"] || activeKeys["Digit0"] || activeKeys["Numpad0"] || activeKeys["KeyJ"];
            
            const isJumpKey = activeKeys["ArrowUp"] || activeKeys["Space"] || activeKeys["KeyZ"] || activeKeys["KeyW"] || activeKeys["KeyK"];
            keys.up = isJumpKey; if (!isJumpKey) jumpHandled = false;

            const isSpinKey = activeKeys["KeyC"] || activeKeys["Numpad2"] || activeKeys["KeyL"];
            keys.spin = isSpinKey; if (!isSpinKey) spinHandled = false;

            const isShootKey = activeKeys["Numpad1"] || activeKeys["Digit1"] || activeKeys["KeyC"] || activeKeys["KeyJ"];
            if (!isShootKey) shootHandled = false;
        }

        window.addEventListener("keydown", (e) => {
            const preventKeys = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '];
            if (preventKeys.includes(e.code) || preventKeys.includes(e.key)) e.preventDefault();
            if (e.code) activeKeys[e.code] = true; if (e.key) activeKeys[e.key] = true;
            updateVirtualKeys();

            if(gameState !== 'playing') return;
            if (keys.up && !jumpHandled) {
                jumpHandled = true;
                if (currentLevelData && currentLevelData.isUnderwater) { player.vy = JUMP_FORCE * 0.4; player.isGrounded = false; player.isSpinning = false; } 
                else if (player.jumps < player.maxJumps && !player.isCrouching) { player.vy = JUMP_FORCE; player.isGrounded = false; player.jumps++; player.isSpinning = false; }
            }
            if (keys.spin && !spinHandled) {
                spinHandled = true;
                if (player.jumps < player.maxJumps && !player.isCrouching && !currentLevelData.isUnderwater && !player.onYoshi) {
                    player.vy = SPIN_JUMP_FORCE; player.isGrounded = false; player.jumps++; player.isSpinning = true;
                }
            }
            if (keys.shoot && !shootHandled) {
                shootHandled = true;
                if (player.powerLevel === 2 && fireballs.length < 2 && !player.isSpinning && !player.carrying) {
                    fireballs.push({ x: player.x + (player.faceDir>0?player.w:0), y: player.y + 20, vx: player.faceDir * 10, vy: 0, w: 12, h: 12, dead: false });
                }
            }
        });

        window.addEventListener("keyup", (e) => { if (e.code) activeKeys[e.code] = false; if (e.key) activeKeys[e.key] = false; updateVirtualKeys(); });
        window.addEventListener("blur", () => { for(let k in activeKeys) activeKeys[k] = false; updateVirtualKeys(); });
        window.addEventListener('resize', () => {
            const container = document.getElementById("game-container");
            const availableHeight = window.innerHeight - 60;
            if ((window.innerWidth - 20) / availableHeight > 256/240) { container.style.height = availableHeight + "px"; container.style.width = (availableHeight * 256/240) + "px"; } 
            else { container.style.width = (window.innerWidth - 20) + "px"; container.style.height = ((window.innerWidth - 20) / (256/240)) + "px"; }
        });

        function checkCollision(r1, r2) { return (r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y); }
        
        function updateUI() {
            document.getElementById("score").innerText = score.toString().padStart(6, '0');
            document.getElementById("coins").innerText = coinsCollected.toString().padStart(2, '0');
            document.getElementById("lives").innerText = lives.toString();
        }

        function spawnCoinPop(x, y) { coinsCollected++; score += 100; if(coinsCollected >= 100) { coinsCollected = 0; lives++; } updateUI(); particles.push({ x: x + 10, y: y, vy: -8, life: 30, type: 'coin' }); }
        function spawnItem(x, y, type) { let item = { x: x, y: y, w: 30, h: 30, type: type, vx: 0, vy: -2, active: false }; if (type === 'mushroom' || type === '1up' || type === 'star' || type === 'yoshi_egg') item.vx = 2; items.push(item); }
        function breakBlock(x, y) { particles.push({x:x,y:y,vx:-3,vy:-8,type:'brick',life:30}); particles.push({x:x+20,y:y,vx:3,vy:-8,type:'brick',life:30}); particles.push({x:x,y:y+20,vx:-4,vy:-5,type:'brick',life:30}); particles.push({x:x+20,y:y+20,vx:4,vy:-5,type:'brick',life:30}); }

        function takeDamage() {
            if (player.invincibleTimer > 0 || player.starTimer > 0 || gameState === 'boss_clear' || gameState === 'clear') return;
            if (player.onYoshi) { player.onYoshi = false; player.h -= 20; player.invincibleTimer = 90; player.vy = -6; } 
            else if (player.powerLevel > 0) { player.powerLevel = 0; player.invincibleTimer = 90; player.h = 32; player.y += 32; }

        }

        function die() {
            if(gameState === 'dead' || gameState === 'boss_clear' || gameState === 'clear' || gameState === 'transition') return;
            gameState = 'dead'; player.dead = true; player.vy = -12; lives--; updateUI();
            setTimeout(() => { if (lives > 0) startTransition(currentLevelIndex); else document.getElementById('game-over').style.display = 'flex'; }, 2000);
        }

        // ================= MAIN PHYSICS & GAME LOOP =================
        function update() {
            if (gameState === 'transition') return;
            if (gameState === 'dead') { player.y += player.vy; player.vy += GRAVITY; return; }

            // Pipe Animations
            if (gameState === 'pipe_enter') {
                player.y += player.vy;
                if (player.y > warpTarget.y + 40) {
                    player.x = warpTarget.warpX; player.y = warpTarget.warpY; cameraX = player.x - 256;
                    if (warpTarget.exitUp) { gameState = 'pipe_exit'; player.vy = -2; } else gameState = 'playing';
                }
                return;
            }
            if (gameState === 'pipe_exit') {
                player.y += player.vy;
                if (player.y + player.h <= warpTarget.exitY) { player.y = warpTarget.exitY - player.h; gameState = 'playing'; player.vy = -4; }
                return;
            }

            let simLeft = cameraX - 800; let simRight = cameraX + canvas.width + 800;
            let activePlatforms = platforms.filter(p => !p.dead && p.x + p.w > simLeft && p.x < simRight);

            if(gameState === 'playing' || gameState === 'boss_clear' || gameState === 'clear') {
                if (gameState === 'boss_clear') { keys.right = true; keys.left = false; keys.down = false; keys.up = false; keys.sprint = false; keys.spin = false; } 
                else if (gameState === 'clear') {
                    if (player.isGrounded) { keys.right = true; keys.left = false; keys.down = false; keys.up = false; keys.sprint = false; keys.spin = false;} 
                    else { keys.right = false; keys.left = false; keys.down = false; keys.up = false; keys.sprint = false; keys.spin = false; }
                }

                // Pipe enter check
                if (keys.down && player.isGrounded && gameState === 'playing' && !player.isCrouching) {
                    let standingOn = activePlatforms.find(p => p.type === 'pipe' && p.entrance && Math.abs((player.x + player.w/2) - (p.x + p.w/2)) < 24 && player.y + player.h <= p.y + 5 + (p.bounceY||0));
                    if (standingOn) { gameState = 'pipe_enter'; warpTarget = standingOn; player.x = standingOn.x + standingOn.w/2 - player.w/2; player.vx = 0; player.vy = 1.5; return; }
                }

                if (keys.down && player.powerLevel > 0 && player.isGrounded && gameState === 'playing' && !player.onYoshi) {
                    if (!player.isCrouching) { player.isCrouching = true; player.h = 32; player.y += 32; } maxSpeed = 0; 
                } else if (!keys.down && player.isCrouching) {
                    player.isCrouching = false; player.h = 64; player.y -= 32;
                } else {
                    maxSpeed = keys.sprint ? MAX_RUN : MAX_WALK; 
                    let accel = keys.sprint ? RUN_ACCEL : WALK_ACCEL;
                    if (keys.right && !keys.left) { player.vx += accel; player.faceDir = 1; } 
                    else if (keys.left && !keys.right) { player.vx -= accel; player.faceDir = -1; } 
                    else {
                        if (player.vx > 0) { player.vx -= SKID_FRICTION; if(player.vx < 0) player.vx = 0; }
                        if (player.vx < 0) { player.vx += SKID_FRICTION; if(player.vx > 0) player.vx = 0; }
                    }
                }
            }
            
            if(player.vx > maxSpeed) player.vx = maxSpeed;
            if(player.vx < -maxSpeed) player.vx = -maxSpeed;
            player.x += player.vx;
            
            if (gameState === 'playing' || gameState === 'boss_clear' || gameState === 'clear') {
                if (player.x < cameraX) { player.x = cameraX; player.vx = 0; }
                if (player.x > cameraX + 256) { cameraX = player.x - 256; }
                if (cameraX > currentLevelData.endX - 350) cameraX = currentLevelData.endX - 350;
            }

            if (player.x >= currentLevelData.endX) {
                player.x = currentLevelData.endX; player.vx = 0;
                if (player.visible) {

                    document.getElementById('level-clear').innerHTML = gameState === 'boss_clear' ? "THANK YOU MARIO!<br><br>BUT OUR PRINCESS IS IN<br>ANOTHER CASTLE!" : "COURSE CLEAR!";
                    document.getElementById('level-clear').style.display = 'flex';
                    setTimeout(nextLevel, gameState === 'boss_clear' ? 3500 : 2000);
                }
            }

            // Platform Bounce Logic & Horizontal Collision
            for (let p of activePlatforms) {

                } else { p.bounceY = 0; }

                if (p.type === 'lava' || p.type === 'axe' || p.type === 'hidden-block' || (p.type === 'bridge' && p.dead)) continue;
                if (p.type === 'pole' && gameState === 'clear') continue;
                if (p.type === 'pole' && gameState === 'playing') {
                    if (player.x + player.w > p.x && player.x < p.x + p.w) { player.x = p.x - player.w / 2; gameState = 'clear'; player.vx = 0; player.vy = 3; score += 1000; updateUI(); return; }
                    continue; 
                }
                
                let platRect = { x: p.x, y: p.y + p.bounceY, w: p.w, h: p.h };
                if (checkCollision(player, platRect)) {

            }

            let currentGravity = GRAVITY;
            if (keys.up && player.vy < 0 && !player.isSpinning) currentGravity = JUMP_HOLD_GRAVITY;
            if (player.powerLevel === 3 && keys.up && player.vy > 0 && !player.isSpinning) { currentGravity = CAPE_GLIDE_GRAVITY; if (player.vy > 2) player.vy = 2; }

            player.vy += (currentLevelData && currentLevelData.isUnderwater) ? 0.2 : currentGravity;
            if (currentLevelData && currentLevelData.isUnderwater && player.vy > 3) player.vy = 3;
            else if (player.vy > MAX_FALL && currentGravity !== CAPE_GLIDE_GRAVITY) player.vy = MAX_FALL;

            player.y += player.vy;
            if (player.isGrounded) player.isSpinning = false;
            player.isGrounded = false;

            // Vertical Collision & Block Interaction
            for (let p of activePlatforms) {
                if (p.type === 'pole' || p.type === 'lava' || p.type === 'axe' || (p.type === 'bridge' && p.dead)) continue;
                let platRect = { x: p.x, y: p.y + p.bounceY, w: p.w, h: p.h };

                if (checkCollision(player, platRect)) {

                        if (player.vy < 0 && player.y > p.y + p.h - 15 && player.x + player.w > p.x && player.x < p.x + p.w) {
                            p.type = 'q-block'; p.hit = true; p.bounceTimer = 10; player.y = p.y + p.h; player.vy = 0;
                            let content = p.content || 'coin';
                            if (content === 'mushroom' && player.powerLevel > 0) content = 'flower'; 
                            if (content === 'coin') spawnCoinPop(p.x, p.y); else spawnItem(p.x, p.y, content);
                        }
                        continue; 
                    }

                    if (player.vy > 0) {
                        if (player.isSpinning && p.type === 'block' && player.powerLevel > 0) {
                            p.dead = true; breakBlock(p.x, p.y); player.vy = -7; score += 50; updateUI();
                        } else {
                            player.y = platRect.y - player.h; player.vy = 0; player.isGrounded = true; player.jumps = 0; player.isSpinning = false;
                        }
                    } else if (player.vy < 0) {
                        player.y = platRect.y + p.h; player.vy = 0;
                        if (p.type === 'q-block' && !p.hit) {
                            p.hit = true; p.bounceTimer = 10;
                            let content = p.content || 'coin';
                            if (content === 'mushroom' && player.powerLevel > 0) content = 'flower'; 
                            if (content === 'coin') spawnCoinPop(p.x, p.y); else spawnItem(p.x, p.y, content);
                        } else if (p.type === 'block' && player.powerLevel > 0) {
                            p.dead = true; breakBlock(p.x, p.y); score += 50; updateUI();
                        } else if (p.type === 'block') {
                            p.bounceTimer = 10; // Bounce without breaking
                        }
                    }
                }
            }

            for (let p of activePlatforms) {
                if (p.type === 'lava' && checkCollision(player, p) && player.y + player.h > p.y + 20) die();
                if (p.type === 'axe' && !p.dead && checkCollision(player, p) && gameState === 'playing') {
                    p.dead = true; for (let b of platforms) { if (b.type === 'bridge') b.dead = true; }
                    gameState = 'boss_clear'; score += 5000; updateUI();
                }
            }

            if (player.invincibleTimer > 0) player.invincibleTimer--;
            if (player.starTimer > 0) { player.starTimer--; player.invincibleTimer = 2; }

            // Items & Shells
            for (let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                if (it.type === 'static_coin') { if (gameState === 'playing' && checkCollision(player, it)) { spawnCoinPop(it.x, it.y); items.splice(i, 1); } continue; }
                if (it.type === 'feather') { it.vy = 1; it.x += Math.sin(Date.now()/200) * 3; }
                else { it.vy += GRAVITY; if (it.y < it.y + 40 && !it.active) { it.active = true; it.vy = -4; } }

                it.x += it.vx;
                for (let p of activePlatforms) {
                    if (['lava', 'axe', 'pole', 'hidden-block'].includes(p.type) || (p.type === 'bridge' && p.dead)) continue;
                    let platRect = { x: p.x, y: p.y + p.bounceY, w: p.w, h: p.h };
                    if (checkCollision(it, platRect)) { if (it.vx > 0) { it.x = platRect.x - it.w; it.vx *= -1; } else if (it.vx < 0) { it.x = platRect.x + p.w; it.vx *= -1; } }
                }

                it.y += it.vy;
                for (let p of activePlatforms) {
                    if (['lava', 'axe', 'pole', 'hidden-block'].includes(p.type) || (p.type === 'bridge' && p.dead)) continue;
                    let platRect = { x: p.x, y: p.y + p.bounceY, w: p.w, h: p.h };
                    if (checkCollision(it, platRect)) { if (it.vy > 0) { it.y = platRect.y - it.h; if (it.type === 'star') it.vy = -7; else it.vy = 0; } }
                }

                if (gameState === 'playing' && checkCollision(player, it)) {
                    if (it.type === 'mushroom') { if (player.powerLevel === 0) { player.powerLevel = 1; player.y -= 32; player.h += 32; } score += 1000; } 
                    else if (it.type === 'flower') { if (player.powerLevel === 0) { player.y -= 32; player.h += 32; } player.powerLevel = 2; score += 1000; } 
                    else if (it.type === 'feather') { if (player.powerLevel === 0) { player.y -= 32; player.h += 32; } player.powerLevel = 3; score += 1000; } 
                    else if (it.type === 'yoshi_egg') { if (!player.onYoshi) { player.onYoshi = true; player.h += 20; player.y -= 20; } score += 1000; } 
                    else if (it.type === '1up') { lives++; score += 1000; } 
                    else if (it.type === 'star') { player.starTimer = 600; score += 1000; }
                    updateUI(); items.splice(i, 1); continue;
                }
                if (it.y > 1600) items.splice(i, 1);
            }

            for (let i = fireballs.length - 1; i >= 0; i--) {
                let fb = fireballs[i]; fb.vy += GRAVITY; fb.x += fb.vx;
                let hitWall = false;
                for (let p of activePlatforms) {
                    if (['lava', 'axe', 'pole', 'hidden-block'].includes(p.type) || (p.type === 'bridge' && p.dead)) continue;
                    if (checkCollision(fb, {x: p.x, y: p.y + p.bounceY, w: p.w, h: p.h})) hitWall = true;
                }
                if (hitWall) { fireballs.splice(i, 1); continue; }
                fb.y += fb.vy;
                for (let p of activePlatforms) {
                    if (['lava', 'axe', 'pole', 'hidden-block'].includes(p.type) || (p.type === 'bridge' && p.dead)) continue;
                    let platRect = { x: p.x, y: p.y + p.bounceY, w: p.w, h: p.h };
                    if (checkCollision(fb, platRect)) { if (fb.vy > 0) { fb.y = platRect.y - fb.h; fb.vy = -6; } else if (fb.vy < 0) { fb.y = platRect.y + p.h; fb.vy = 0; } }
                }
                if (fb.y > 1600) { fireballs.splice(i, 1); continue; }

                let hitEnemy = false;
                for (let e of enemies) {
                    if (!e.dead && e.type !== 'piranha' && e.state !== 'carried' && checkCollision(fb, e)) {
                        if (e.type === 'bowser') { e.hp -= 1; hitEnemy = true; break; } 
                        else { e.dead = true; e.squishTimer = 10; score += 200; updateUI(); hitEnemy = true; break; }
                    }
                }
                if (hitEnemy) { fireballs.splice(i, 1); continue; }
            }

            if (player.y > 1600) { die(); }

            // Enemies
            for (let e of enemies) {
                if (e.dead) { if (e.squishTimer > 0) e.squishTimer--; continue; }

                // Shell Carrying Logic
                if (e.state === 'carried') {
                    e.x = player.faceDir > 0 ? player.x + player.w : player.x - e.w;
                    e.y = player.y + player.h / 2 - e.h / 2;
                    if (!keys.sprint) {
                        e.state = 'shell_move'; e.vx = player.faceDir * 12; player.carrying = null;
                        player.vx = -player.faceDir * 3; // Throw Recoil
                    }
                    continue; 
                }

                if (e.x + e.w < simLeft || e.x > simRight) continue;

                if (e.type === 'piranha') {
                    e.timer++;
                    if (e.state === 'up') { if (e.timer > 60) { e.vy = 1; e.state = 'moving_down'; } } 
                    else if (e.state === 'moving_down') { e.y += e.vy; if (e.y >= e.baseY) { e.y = e.baseY; e.state = 'down'; e.timer = 0; } } 
                    else if (e.state === 'down') { if (e.timer > 60 && Math.abs(player.x - e.x) > 60) { e.vy = -1; e.state = 'moving_up'; } } 
                    else if (e.state === 'moving_up') { e.y += e.vy; if (e.y <= e.baseY - e.h) { e.y = e.baseY - e.h; e.state = 'up'; e.timer = 0; } }
                    
                    if (gameState === 'playing' && checkCollision(player, e)) {
                        if (player.starTimer > 0 || player.isSpinning) { e.dead = true; score += 200; spawnCoinPop(e.x, e.y); if(player.isSpinning) player.vy = -8; }

                    }
                    continue;
                }
                
                if (e.type === 'bowser') {
                    e.timer++;
                    if (e.timer % 150 < 75) e.vx = -1; else e.vx = 1;
                    if (e.timer % 100 === 0 && e.isGrounded) e.vy = -8; 
                    if (e.timer % 120 === 0 && Math.random() > 0.3) enemyFireballs.push({ x: e.x, y: e.y + 10, w: 32, h: 16, vx: -5, vy: 0, dead: false });
                    if (gameState === 'playing' && checkCollision(player, e)) { if (player.starTimer > 0) e.hp = 0; else takeDamage(); }
                    e.vy += GRAVITY; e.x += e.vx;
                    for (let p of activePlatforms) {
                        if (['pole', 'axe', 'lava', 'bridge', 'hidden-block'].includes(p.type)) continue;
                        if (checkCollision(e, p)) { if (e.vx > 0) { e.x = p.x - e.w; e.vx *= -1; } else if (e.vx < 0) { e.x = p.x + p.w; e.vx *= -1; } }
                    }
                    e.y += e.vy; e.isGrounded = false;
                    for (let p of activePlatforms) {
                        if (['pole', 'axe', 'lava', 'bridge', 'hidden-block'].includes(p.type)) continue;
                        if (checkCollision(e, p)) { if (e.vy > 0) { e.y = p.y - e.h; e.vy = 0; e.isGrounded = true; } }

                }
                
                if (e.type === 'cheepcheep') {

                }

                e.vy += GRAVITY; e.x += e.vx;

                    if(['pole', 'bridge', 'hidden-block'].includes(p.type)) continue;
                    let platRect = { x: p.x, y: p.y + p.bounceY, w: p.w, h: p.h };
                    if (checkCollision(e, platRect)) { if (e.vx > 0) { e.x = platRect.x - e.w; e.vx *= -1; } else if (e.vx < 0) { e.x = platRect.x + p.w; e.vx *= -1; } }
                }
                e.y += e.vy;
                for (let p of activePlatforms) {

                    let platRect = { x: p.x, y: p.y + p.bounceY, w: p.w, h: p.h };
                    if (checkCollision(e, platRect)) {

                        }
                    }
                }
                if(e.y > 1600) e.dead = true;

                if (e.state === 'shell_move') {
                    for (let other of enemies) {
                        if (other !== e && !other.dead && other.type !== 'piranha' && checkCollision(e, other)) {

                        }

                        e.dead = true; e.squishTimer = 10; score += 200; updateUI();

                        }

                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {

                pt.y += pt.vy; pt.vy += GRAVITY; pt.x += pt.vx || 0; pt.life--;

            }
        }

        // ================= FAST HARDWARE DRAWING =================
        function draw() {
            if (gameState === 'transition') return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Draw seamless parallax background
            ctx.drawImage(imageCache.parallax, -(cameraX * 0.5) % 1024, 0);

                if (p) {
                    ctx.fillStyle = "#008800"; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.fillStyle = "#58f898"; ctx.fillRect(p.x + 8, p.y, 8, p.h); 
                    ctx.fillStyle = "#008800"; ctx.fillRect(p.x - 4, p.y, p.w + 8, 20); ctx.fillStyle = "#58f898"; ctx.fillRect(p.x + 4, p.y, 8, 20);
                    ctx.fillStyle = "#000"; ctx.strokeRect(p.x, p.y+20, p.w, p.h-20); ctx.strokeRect(p.x - 4, p.y, p.w + 8, 20);
                }
            }

            for (let it of items) {

                    let frame = Math.floor(Date.now() / 150) % 4; let cw = [16, 10, 4, 10][frame];
                    ctx.fillStyle = "#f8d820"; ctx.fillRect(it.x + 15 - cw/2, it.y, cw, 24); ctx.fillStyle = "#fff"; ctx.fillRect(it.x + 15 - cw/2 + 2, it.y + 2, cw/2, 20); 
                    continue; 
                }
                if (it.type === 'mushroom' || it.type === '1up') {
                    ctx.fillStyle = it.type === 'mushroom' ? "#e52521" : "#58f898"; ctx.fillRect(it.x, it.y, it.w, it.h);
                    ctx.fillStyle = "#f8c898"; ctx.fillRect(it.x + 6, it.y + 16, 18, 14); 
                    ctx.fillStyle = "#fff"; ctx.fillRect(it.x + 4, it.y + 4, 6, 6); ctx.fillRect(it.x + 20, it.y + 4, 6, 6); ctx.fillRect(it.x + 12, it.y + 2, 6, 4);
                } else if (it.type === 'flower') {
                    let fFlash = Math.floor(Date.now() / 100) % 2 === 0;
                    ctx.fillStyle = "#58f898"; ctx.fillRect(it.x + 12, it.y + 16, 6, 14);
                    ctx.fillStyle = fFlash ? "#f8d820" : "#e52521"; ctx.fillRect(it.x, it.y, 30, 20);
                    ctx.fillStyle = fFlash ? "#e52521" : "#f8d820"; ctx.fillRect(it.x + 6, it.y + 4, 18, 12);
                    ctx.fillStyle = "#fff"; ctx.fillRect(it.x + 13, it.y + 8, 4, 4);
                } else if (it.type === 'star') {
                    let sColors = ["#f8d820", "#e52521", "#fff", "#f8d820"]; ctx.fillStyle = sColors[Math.floor(Date.now() / 100) % 4];
                    ctx.fillRect(it.x, it.y, it.w, it.h);
                    ctx.fillStyle = "#000"; ctx.fillRect(it.x + 8, it.y + 8, 4, 8); ctx.fillRect(it.x + 18, it.y + 8, 4, 8);
                } else if (it.type === 'feather') {
                    ctx.fillStyle = "#f8d820"; ctx.fillRect(it.x, it.y, 20, 10); ctx.fillRect(it.x + 10, it.y + 10, 20, 10); ctx.fillRect(it.x + 20, it.y + 20, 10, 10);
                } else if (it.type === 'yoshi_egg') {
                    ctx.fillStyle = "#fff"; ctx.fillRect(it.x + 5, it.y, 20, 30); ctx.fillStyle = "#58f898"; ctx.fillRect(it.x + 10, it.y + 10, 6, 6); ctx.fillRect(it.x + 16, it.y + 20, 6, 6);
                }
            }

            for(let e of enemies) {
                if (e.dead && e.squishTimer <= 0) continue;
                if (e.x + e.w < viewLeft || e.x > viewRight) continue; 
                
                ctx.save(); let enemyFaceDir = (e.vx > 0) ? 1 : -1;
                if (e.type !== 'piranha' && enemyFaceDir > 0) { ctx.translate(e.x + e.w, e.y); ctx.scale(-1, 1); ctx.translate(-e.x, -e.y); }
                
                if (e.type === 'piranha') {
                    ctx.fillStyle = "#e52521"; ctx.fillRect(e.x, e.y, e.w, e.h);
                    ctx.fillStyle = "#fff"; ctx.fillRect(e.x + 8, e.y + 12, 6, 6); ctx.fillRect(e.x + 26, e.y + 12, 6, 6);
                    ctx.fillStyle = "#58f898"; ctx.fillRect(e.x + 16, e.y + 30, 8, e.h - 30);
                    ctx.fillStyle = "#fff"; ctx.fillRect(e.x, e.y + 6, e.w, 6); 
                } else if (e.type === 'koopa') {
                    if (e.squishTimer > 0 || e.state === 'shell_idle' || e.state === 'shell_move' || e.state === 'carried') {
                        ctx.fillStyle = "#00b000"; ctx.fillRect(e.x, e.y, e.w, e.h); ctx.fillStyle = "#f8c898"; ctx.fillRect(e.x, e.y + 20, e.w, 10);
                    } else {
                        let step = Math.floor(Date.now() / 150) % 2;
                        ctx.fillStyle = "#00b000"; ctx.fillRect(e.x, e.y + 10, e.w, e.h - 10); ctx.fillStyle = "#f8c898"; ctx.fillRect(e.x - 8, e.y, 20, 20); 
                        ctx.fillStyle = "#000"; ctx.fillRect(e.x - 4, e.y + 4, 4, 6); 
                        if(step === 0) { ctx.fillRect(e.x, e.y + e.h - 4, 8, 4); ctx.fillRect(e.x + 20, e.y + e.h - 4, 8, 4); } 
                        else { ctx.fillRect(e.x + 8, e.y + e.h - 4, 8, 4); ctx.fillRect(e.x + 24, e.y + e.h - 4, 8, 4); }
                    }
                } else if (e.type === 'goomba') {
                    if (e.squishTimer > 0) {
                        ctx.fillStyle = "#a84400"; ctx.fillRect(e.x, e.y + e.h - 10, e.w, 10);
                    } else {
                        ctx.fillStyle = "#a84400"; ctx.fillRect(e.x, e.y, e.w, e.h);
                        ctx.fillStyle = "#fff"; ctx.fillRect(e.x + 6, e.y + 10, 6, 8); ctx.fillRect(e.x + 18, e.y + 10, 6, 8);
                        ctx.fillStyle = "#000"; ctx.fillRect(e.x + 8, e.y + 12, 4, 4); ctx.fillRect(e.x + 18, e.y + 12, 4, 4);
                        let step = Math.floor(Date.now() / 150) % 2;
                        if(step === 0) { ctx.fillRect(e.x - 4, e.y + e.h - 4, 12, 4); ctx.fillRect(e.x + 18, e.y + e.h - 4, 12, 4); } 
                        else { ctx.fillRect(e.x + 4, e.y + e.h - 4, 10, 4); ctx.fillRect(e.x + 16, e.y + e.h - 4, 10, 4); }
                    }
                } else if (e.type === 'bowser') {
                    let bStep = Math.floor(Date.now() / 200) % 2; let py = e.y;
                    ctx.fillStyle = "#f88800"; ctx.fillRect(e.x+8, py+12, 48, 48); ctx.fillRect(e.x + 8, py + 8, 24, 24); 
                    ctx.fillStyle = "#f8c898"; ctx.fillRect(e.x, py + 16, 16, 16); 
                    ctx.fillStyle = "#000"; ctx.fillRect(e.x + 12, py + 12, 4, 4); 
                    ctx.fillStyle = "#e52521"; ctx.fillRect(e.x + 16, py, 12, 8); 
                    ctx.fillStyle = "#00b000"; ctx.fillRect(e.x + 24, py + 16, 40, 40);
                    ctx.fillStyle = "#008800"; ctx.fillRect(e.x + 28, py + 16, 12, 40); 
                    ctx.fillStyle = "#fff"; ctx.fillRect(e.x + 50, py + 20, 6, 6); ctx.fillRect(e.x + 58, py + 30, 6, 6); ctx.fillRect(e.x + 50, py + 44, 6, 6);
                    ctx.fillStyle = "#f88800"; 
                    if (bStep === 0) { ctx.fillRect(e.x + 16, py + 52, 12, 12); ctx.fillRect(e.x + 36, py + 52, 12, 12); } 
                    else { ctx.fillRect(e.x + 12, py + 52, 12, 12); ctx.fillRect(e.x + 40, py + 52, 12, 12); }
                    if (e.timer % 120 > 100) { ctx.fillStyle = "#000"; ctx.fillRect(e.x, py + 24, 12, 6); }
                }
                ctx.restore();
            }

            for (let p of platforms) {
                if (p.x + p.w < viewLeft || p.x > viewRight) continue; 
                let dY = p.y + (p.bounceY || 0);

                if (p.type === 'ground' || p.type === 'stair' || p.type === 'block') {
                    let useCache = (p.type === 'stair' || p.type === 'ground') ? imageCache.ground : imageCache.brick;
                    if(useCache) { 
                        for(let tx=0; tx < p.w; tx+=40) {
                            for(let ty=0; ty < p.h; ty+=40) {
                                let dW = Math.min(40, p.w - tx); let dH = Math.min(40, p.h - ty);
                                ctx.drawImage(useCache, 0, 0, dW, dH, p.x + tx, dY + ty, dW, dH);
                            }
                        }
                    } else { ctx.fillStyle = currentLevelData.groundColor; ctx.fillRect(p.x, dY, p.w, p.h); }
                } else if (p.type === 'pipe') {
                    ctx.fillStyle = "#008800"; ctx.fillRect(p.x, dY, p.w, p.h); ctx.fillStyle = "#58f898"; ctx.fillRect(p.x + 8, dY, 8, p.h); 
                    ctx.fillStyle = "#008800"; ctx.fillRect(p.x - 4, dY, p.w + 8, 20); ctx.fillStyle = "#58f898"; ctx.fillRect(p.x + 4, dY, 8, 20);
                    ctx.fillStyle = "#000"; ctx.strokeRect(p.x, dY+20, p.w, p.h-20); ctx.strokeRect(p.x - 4, dY, p.w + 8, 20);
                } else if (p.type === 'q-block') {
                    if (p.hit) ctx.drawImage(imageCache.qblockHit, p.x, dY, p.w, p.h);
                    else ctx.drawImage(((Math.floor(Date.now() / 150) % 3) === 0) ? imageCache.qblockFlash : imageCache.qblock, p.x, dY, p.w, p.h);
                } else if (p.type === 'pole') {
                    ctx.fillStyle = "#e52521"; ctx.fillRect(p.x - 15, dY + p.h - 20, 40, 20);
                    ctx.fillStyle = "#a8e46a"; ctx.fillRect(p.x, dY, p.w, p.h);
                    ctx.fillStyle = "#00b000"; ctx.fillRect(p.x - 4, dY - 10, 18, 18);
                    if(gameState === 'playing' || gameState === 'clear') { ctx.fillStyle = "#fff"; ctx.fillRect(p.x - 30, dY + 20, 30, 20); ctx.fillStyle = "#20b800"; ctx.fillRect(p.x - 20, dY + 26, 8, 8); }
                } else if (p.type === 'lava') {
                    let lAnim = Math.floor(Date.now() / 300) % 2; ctx.fillStyle = "#e52521"; ctx.fillRect(p.x, dY, p.w, p.h);
                    ctx.fillStyle = "#f8d820"; for (let lx = 0; lx < p.w; lx += 20) { if ((lx/20 + lAnim) % 2 === 0) { ctx.fillRect(p.x + lx + 4, dY + 4, 12, 4); ctx.fillRect(p.x + lx + 8, dY + 8, 4, 4); } }
                } else if (p.type === 'bridge' && !p.dead) {
                    ctx.fillStyle = "#c84c0c"; for (let bx = 0; bx < p.w; bx += 30) { ctx.fillRect(p.x + bx + 2, dY + 8, 26, 12); }
                    ctx.fillStyle = "#f8c898"; ctx.fillRect(p.x, dY + 4, p.w, 4); ctx.fillRect(p.x, dY + 20, p.w, 4);
                } else if (p.type === 'axe' && !p.dead) {
                    ctx.fillStyle = "#f8c898"; ctx.fillRect(p.x + 16, dY, 8, 40); ctx.fillStyle = "#fff"; ctx.fillRect(p.x + 4, dY + 4, 16, 24); ctx.fillStyle = "#000"; ctx.fillRect(p.x + 2, dY + 6, 2, 20);
                }
            }

            for(let pt of particles) {
                if (pt.x + 20 < viewLeft || pt.x > viewRight) continue; 
                if (pt.type === 'coin') {
                    let frame = Math.floor(Date.now() / 100) % 4; let cw = [16, 10, 4, 10][frame];
                    ctx.fillStyle = "#f8d820"; ctx.fillRect(pt.x + 15 - cw/2, pt.y, cw, 24); ctx.fillStyle = "#fff"; ctx.fillRect(pt.x + 15 - cw/2 + 2, pt.y + 2, cw/2, 20); 
                } else if (pt.type === 'brick') { ctx.fillStyle = currentLevelData.brickColor; ctx.fillRect(pt.x, pt.y, 8, 8); }
            }
            for (let fb of fireballs) {
                if (fb.x + 20 < viewLeft || fb.x > viewRight) continue;
                ctx.fillStyle = (Math.floor(Date.now() / 50) % 2 === 0) ? "#e52521" : "#f8d820"; ctx.fillRect(fb.x + 2, fb.y, 8, 12); ctx.fillRect(fb.x, fb.y + 2, 12, 8);
            }
            for (let efb of enemyFireballs) {
                if (efb.x + 40 < viewLeft || efb.x > viewRight) continue;
                ctx.fillStyle = (Math.floor(Date.now() / 100) % 2 === 0) ? "#e52521" : "#f88800"; ctx.fillRect(efb.x, efb.y, 24, 12); ctx.fillStyle = "#f8d820"; ctx.fillRect(efb.x + 4, efb.y + 2, 16, 8);
            }

            if ((!player.dead || gameState === 'dead') && player.visible !== false) {
                let shouldDraw = true;
                if (player.starTimer > 0) { shouldDraw = (player.starTimer % 6 > 2); } else if (player.invincibleTimer > 0) { shouldDraw = (player.invincibleTimer % 10 < 5); }

                if (shouldDraw) {
                    let shirtColor = "#e52521"; let overallsColor = "#0000f8"; 
                    if (player.powerLevel === 2) { shirtColor = "#f8d820"; overallsColor = "#e52521"; }
                    if (player.starTimer > 0) {
                        let colors = ["#e52521", "#f8d820", "#58f898", "#fff", "#0000f8"];
                        shirtColor = colors[Math.floor((player.starTimer % 15) / 3)]; overallsColor = colors[Math.floor(((player.starTimer + 5) % 15) / 3)];
                    }

                    let faceDir = (player.vx >= 0 && gameState !== 'dead') ? 1 : -1;
                    if(gameState==='dead') faceDir = 1; 

                    let isMoving = Math.abs(player.vx) > 0.5; let walkFrame = isMoving ? Math.floor(Date.now() / 100) % 3 : 0;
                    
                    ctx.save();
                    if (faceDir < 0) { ctx.translate(player.x + player.w, player.y); ctx.scale(-1, 1); } else { ctx.translate(player.x, player.y); }

                    if (player.isSpinning) { ctx.translate(player.w/2, player.h/2); let rot = (Date.now() / 50) % (Math.PI * 2); if (faceDir < 0) rot = -rot; ctx.rotate(rot); ctx.translate(-player.w/2, -player.h/2); }
                    if (player.powerLevel === 3) {
                        ctx.fillStyle = "#f8d820"; 
                        if (player.isGrounded) { ctx.fillRect(-10, 20, 16, 40); } 
                        else { if (keys.up && player.vy > 0 && !player.isSpinning) ctx.fillRect(-30, 10, 40, 16); else ctx.fillRect(-20, 15, 24, 20); }
                    }
                    if (player.onYoshi) {
                        ctx.fillStyle = "#58f898"; ctx.fillRect(8, 40, 24, 32); ctx.fillRect(20, 24, 20, 20); 
                        ctx.fillStyle = "#fff"; ctx.fillRect(32, 24, 8, 12); ctx.fillStyle = "#e52521"; ctx.fillRect(36, 16, 8, 8); ctx.fillStyle = "#000"; ctx.fillRect(28, 28, 4, 4); 
                        ctx.fillStyle = "#f8c898"; if (isMoving && walkFrame === 0) { ctx.fillRect(8, 72, 8, 8); ctx.fillRect(24, 72, 8, 8); } else { ctx.fillRect(4, 70, 8, 8); ctx.fillRect(28, 70, 8, 8); }
                    }

                    if (player.powerLevel === 0 || player.isCrouching) { ctx.scale(1, 0.5); }
                    let py = 0; 
                    ctx.fillStyle = shirtColor; ctx.fillRect(4, py, 16, 6); ctx.fillRect(4, py + 6, 24, 4); 
                    ctx.fillStyle = "#f8c898"; ctx.fillRect(4, py + 10, 18, 14); ctx.fillRect(22, py + 12, 6, 8);  
                    ctx.fillStyle = "#000"; ctx.fillRect(4, py + 10, 6, 8); ctx.fillRect(16, py + 8, 4, 8); ctx.fillRect(20, py + 16, 10, 4); 
                    ctx.fillStyle = shirtColor; ctx.fillRect(4, py + 24, 16, 16); 
                    
                    if (!player.isGrounded && gameState !== 'dead') {
                        ctx.fillRect(0, py + 24, 8, 12); ctx.fillRect(20, py + 20, 8, 12); 
                        ctx.fillStyle = overallsColor; ctx.fillRect(4, py + 34, 16, 14); ctx.fillRect(0, py + 42, 8, 10); ctx.fillRect(16, py + 40, 12, 8); 
                        ctx.fillStyle = "#000"; ctx.fillRect(-4, py + 48, 12, 6); ctx.fillRect(20, py + 38, 10, 10);
                    } else if (isMoving && gameState !== 'dead') {
                        ctx.fillRect(0, py + 30, 8, 10); ctx.fillRect(20, py + 30, 8, 10);
                        ctx.fillStyle = overallsColor; ctx.fillRect(4, py + 32, 16, 16); 
                        ctx.fillStyle = "#000"; if (walkFrame === 0 || walkFrame === 2) { ctx.fillRect(4, py + 48, 10, 8); ctx.fillRect(16, py + 48, 10, 8); } else { ctx.fillRect(0, py + 46, 10, 8); ctx.fillRect(20, py + 48, 10, 8); }
                    } else {
                        ctx.fillRect(0, py + 30, 6, 12); 
                        ctx.fillStyle = overallsColor; ctx.fillRect(4, py + 32, 16, 16); ctx.fillRect(6, py + 48, 8, 10); ctx.fillRect(16, py + 48, 8, 10); 
                        ctx.fillStyle = "#f8d820"; ctx.fillRect(8, py + 34, 4, 4); ctx.fillRect(16, py + 34, 4, 4);
                        ctx.fillStyle = "#000"; ctx.fillRect(2, py + 54, 12, 6); ctx.fillRect(14, py + 54, 12, 6);
                    }
                    ctx.restore();
                }
            }

            ctx.restore();
        }

        function gameLoop(timestamp) {
            animationFrameId = requestAnimationFrame(gameLoop);
            if (!timestamp) timestamp = 0; let elapsed = timestamp - lastFrameTime;
            if (elapsed >= FPS_INTERVAL) { lastFrameTime = timestamp - (elapsed % FPS_INTERVAL); update(); draw(); }
        }
        
        startTransition(0); gameLoop();
    </script>
</body>
